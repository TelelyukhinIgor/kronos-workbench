<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc"><title id="title">KRONOS WORKBENCH workflow</title><desc id="desc">Architecture overview, not a screenshot or market forecast.</desc><rect width="1200" height="350" rx="20" fill="#0c1f2e"/><g font-family="Arial,Helvetica,sans-serif"><text x="44" y="69" fill="#f4f7fa" font-size="37" font-weight="700" letter-spacing="2">KRONOS WORKBENCH</text><text x="46" y="112" fill="#afc1d0" font-size="22">From a model call to an inspectable experiment.</text><text x="46" y="145" fill="#e8b25d" font-size="12" letter-spacing="2">RESEARCH SOFTWARE / IGOR TELELYUKHIN</text><rect x="44" y="182" width="350" height="130" rx="14" fill="#142d40" stroke="#315064"/><text x="66" y="213" fill="#e8b25d" font-size="12" letter-spacing="2">01 / LOAD</text><text x="66" y="250" fill="#f4f7fa" font-size="23" font-weight="600">Closed candles</text><text x="66" y="280" fill="#afc1d0" font-size="17">Explicit data semantics</text><rect x="418" y="182" width="350" height="130" rx="14" fill="#142d40" stroke="#315064"/><text x="440" y="213" fill="#e8b25d" font-size="12" letter-spacing="2">02 / EXPLORE</text><text x="440" y="250" fill="#f4f7fa" font-size="23" font-weight="600">CPU scenarios</text><text x="440" y="280" fill="#afc1d0" font-size="17">Individual paths + mean</text><rect x="792" y="182" width="350" height="130" rx="14" fill="#142d40" stroke="#315064"/><text x="814" y="213" fill="#e8b25d" font-size="12" letter-spacing="2">03 / INSPECT</text><text x="814" y="250" fill="#f4f7fa" font-size="23" font-weight="600">Quality checks</text><text x="814" y="280" fill="#afc1d0" font-size="17">CSV + JSON + PNG</text></g></svg>